<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomic</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --border: #2c303a; --text: #d8dbe2; --muted: #8a909e;
    --accent: #7aa2f7; --error: #f7768e; --result: #9ece6a; --announce: #e0af68;
    --chat: #c0caf5; --whisper: #bb9af7; --input: #7dcfff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 13px; }
  #status.online::before { content: "● "; color: var(--result); }
  #status.offline::before { content: "● "; color: var(--error); }
  #users { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  #users b { color: var(--text); font-weight: 500; }
  main { flex: 1; display: flex; min-height: 0; }
  #toggle-rules { padding: 3px 12px; }
  #rules { width: 440px; flex: none; overflow-y: auto; padding: 12px 16px; background: var(--panel);
           border-left: 1px solid var(--border); }
  #rules h2 { font-size: 14px; margin: 0; }
  #rules p { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #rules pre { font: 12px/1.45 var(--mono); tab-size: 4; white-space: pre-wrap; word-break: break-word;
               background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
               padding: 8px 10px; margin: 0 0 8px; }
  #log { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 16px; font-family: var(--mono); font-size: 13px; }
  .msg { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
  .msg.input { color: var(--input); margin-top: 8px; }
  .msg.input::before { content: "> "; color: var(--muted); }
  .msg.result { color: var(--result); }
  .msg.error { color: var(--error); }
  .msg.announce { color: var(--announce); font-style: italic; }
  .msg.chat { color: var(--chat); }
  .msg.whisper { color: var(--whisper); }
  .msg.system { color: var(--muted); font-style: italic; }
  .msg.persist { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--announce);
                 background: var(--panel); color: var(--text); }
  .msg.persist::first-line { color: var(--announce); font-weight: 600; }
  .msg.proposal { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent);
                  background: var(--panel); color: var(--text); }
  .msg.proposal::first-line { color: var(--accent); font-weight: 600; }
  form#editor { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border);
                background: var(--panel); }
  textarea { flex: 1; min-height: 84px; max-height: 40vh; resize: vertical; background: var(--bg);
             color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
             font: 13px/1.45 var(--mono); tab-size: 4; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--accent); color: #11131a; border: 0; border-radius: 6px; padding: 0 18px;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #login { position: fixed; inset: 0; background: rgba(10,11,14,.85); display: flex;
           align-items: center; justify-content: center; padding: 16px; }
  #login form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
                padding: 24px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #login h2 { margin: 0; font-size: 18px; }
  #login p { margin: 0; color: var(--muted); font-size: 13px; }
  #login input { background: var(--bg); color: var(--text); border: 1px solid var(--border);
                 border-radius: 6px; padding: 9px 10px; font-size: 14px; }
  #login button { padding: 10px; }
  #login .err { color: var(--error); min-height: 1em; }
  .hidden { display: none !important; }
  @media (max-width: 900px) {
    #rules { position: fixed; inset: 41px 0 0 0; width: auto; border-left: 0; }
  }
  @media (max-width: 600px) {
    form#editor { flex-direction: column; }
    button { padding: 10px; }
    #users { display: none; }
    #toggle-rules { margin-left: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Nomic</h1>
  <span id="status" class="offline">offline</span>
  <span id="users"></span>
  <button id="toggle-rules" type="button">Rules</button>
</header>
<main>
  <div id="log" aria-live="polite"></div>
  <aside id="rules">
    <h2>Current rules</h2>
    <p>Rules run in order, so later rules replace anything they redefine.</p>
    <div id="rule-list"></div>
  </aside>
</main>
<form id="editor">
  <textarea id="code" spellcheck="false" placeholder="say &quot;hello&quot;   — Ctrl+Enter to run, help for how to play"></textarea>
  <button id="run" type="submit" disabled>Run</button>
</form>

<div id="login">
  <form>
    <h2>Join the game</h2>
    <p>The rules are Nomsu code running on a shared server, and changing them is the game.</p>
    <input id="name" placeholder="username" maxlength="20" autocomplete="username" required
           pattern="[A-Za-z0-9_\-]{1,20}" title="1-20 letters, digits, _ or -">
    <button type="submit">Connect</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), code = $("code"), runBtn = $("run");
let socket = null, myName = null, history = [], historyPos = 0, draft = "";

function addLine(text, kind) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const div = document.createElement("div");
  div.className = "msg " + (kind || "text");
  div.textContent = text;
  log.appendChild(div);
  while (log.childNodes.length > 2000) log.removeChild(log.firstChild);
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function showRules(rules) {
  const list = $("rule-list"), grew = list.children.length && rules.length > list.children.length;
  list.replaceChildren(...rules.map((rule) => {
    const pre = document.createElement("pre");
    pre.textContent = rule;
    return pre;
  }));
  if (grew) $("rules").scrollTop = $("rules").scrollHeight;
}

if (window.innerWidth <= 900) $("rules").classList.add("hidden");
$("toggle-rules").addEventListener("click", () => $("rules").classList.toggle("hidden"));

function setStatus(online, text) {
  $("status").className = online ? "online" : "offline";
  $("status").textContent = text;
  runBtn.disabled = !online;
}

function connect(name) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(`${proto}//${location.host}/ws?name=${encodeURIComponent(name)}`);
  let welcomed = false;
  socket.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "welcome") {
      welcomed = true;
      myName = msg.name;
      localStorage.setItem("lua-world-name", myName);
      $("login").classList.add("hidden");
      setStatus(true, myName);
      addLine(`Connected as ${myName}. Type help for how to play.`, "system");
      code.focus();
    } else if (msg.type === "rejected") {
      $("login-err").textContent = msg.text;
    } else if (msg.type === "users") {
      $("users").innerHTML = "";
      $("users").append("Online: ");
      msg.users.forEach((u, i) => {
        const b = document.createElement("b");
        b.textContent = u;
        if (i) $("users").append(", ");
        $("users").append(b);
      });
    } else if (msg.type === "rules") {
      showRules(msg.rules);
    } else if (msg.type === "message") {
      addLine(msg.text, msg.kind);
    }
  };
  socket.onclose = () => {
    setStatus(false, "offline");
    $("users").textContent = "";
    if (welcomed) {
      addLine("Disconnected from server.", "system");
      $("login-err").textContent = "Disconnected. Reconnect?";
    } else if (!$("login-err").textContent) {
      $("login-err").textContent = "Couldn't connect to the server.";
    }
    $("login").classList.remove("hidden");
  };
}

$("login").querySelector("form").addEventListener("submit", (e) => {
  e.preventDefault();
  $("login-err").textContent = "";
  if (socket) socket.onclose = null, socket.close();
  connect($("name").value.trim());
});
try { $("name").value = localStorage.getItem("lua-world-name") || ""; } catch {}
$("name").focus();

function submit() {
  const text = code.value;
  if (!text.trim() || !socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(text);
  addLine(text, "input");
  log.scrollTop = log.scrollHeight;
  if (history[history.length - 1] !== text) history.push(text);
  historyPos = history.length;
  code.value = "";
}

$("editor").addEventListener("submit", (e) => { e.preventDefault(); submit(); code.focus(); });

code.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === "Enter") {
    e.preventDefault();
    submit();
  } else if (mod && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault();
    if (historyPos === history.length) draft = code.value;
    historyPos = Math.max(0, Math.min(history.length, historyPos + (e.key === "ArrowUp" ? -1 : 1)));
    code.value = historyPos === history.length ? draft : history[historyPos];
  } else if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    code.setRangeText("    ", code.selectionStart, code.selectionEnd, "end");
  }
});
</script>
</body>
</html>
